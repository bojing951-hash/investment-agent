# ── 尚未激活的CI工作流定义 ─────────────────────────────────────────
# 本文件是可直接启用的GitHub Actions离线测试工作流(内容即最终版)。
# 未放入.github/workflows/的原因: 当前推送凭据(Personal Access Token)
# 缺少workflow scope, GitHub拒绝以该令牌创建/更新workflow文件。
# 启用方法: 拥有workflow scope的凭据执行
#   mkdir -p .github/workflows && cp docs/github_actions_tests.yml .github/workflows/tests.yml
#   git add .github/workflows/tests.yml && git commit && git push
# 在此之前: 本仓库未建立CI, 不得宣称"CI通过"(所有测试结果均为本地离线运行)。
name: offline-tests
# IA-P0-1-FIX1 独立复核用离线测试工作流:
# - 只跑本地离线套件(全部SYNTHETIC fixture+GLM mock),零网络依赖、零API密钥、零付费调用
# - test_glm_live.py 为真实GLM验收套件,按契约不得进入CI,显式排除
# - 依赖: 仅Python标准库(被测模块不引入第三方包)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行全部离线测试套件(排除test_glm_live)
        run: |
          fail=0
          for t in tests/test_*.py; do
            name=$(basename "$t" .py)
            if [ "$name" = "test_glm_live" ]; then
              echo "== $name: SKIPPED(真实GLM付费调用,不进CI)"
              continue
            fi
            echo "== $name"
            if ! python3 "$t"; then
              echo "::error file=$t::套件 $name 失败"
              fail=1
            fi
          done
          exit $fail
