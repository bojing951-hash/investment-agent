[pytest]
# Audit-R1 F04: 本仓套件=自执行脚本(尾部 sys.exit)或 unittest 自面
# (__main__ 下 unittest.main()),CI 以 `python3 tests/test_*.py` 直跑。
# pytest 下由 tests/conftest.py 的适配器把每个 test_*.py 包成单用例
# 子进程直跑(同构 CI,rc=真相)。默认 python 模块收集会 import 文件
# 本体 → 脚本式套件收集期 SystemExit=INTERNALERROR(pass/fail 不可分),
# 故以哨兵模式停用之;真 pytest 原生套件(如有)应命名为 *_pytest_native.py。
# Audit-R2: 三入口契约=`pytest tests/`(目录)、单文件、-k 筛选均正常
# (tests/conftest.py makemodule 拦截 initpath 绕行, 回归=tests/
# test_pytest_entry_fix.py);排除件 test_model_live.py 显式路径直入
# =可见 skip, 不导入不执行。
python_files = *_pytest_native.py
